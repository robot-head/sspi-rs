name: publish-krabka-sspi

# Publish the root crate of this fork to crates.io as `krabka-sspi`.
# No other workspace crate is published.
#
# A `krabka-sspi-v*` tag push publishes. A manual run is a dry run unless
# `dry_run` is off, and a manual run that publishes must be started from a
# `krabka-sspi-v*` tag.
#
# The publish job authenticates in one of two ways:
#
# - Token. The krabka-io organization secret `CARGO_REGISTRY_TOKEN`, which
#   this repository inherits, is read as `secrets.CARGO_REGISTRY_TOKEN`. No
#   repository or environment secret needs to be added. crates.io allows
#   trusted publishing only for a crate that already exists, so the first
#   publish of `krabka-sspi` uses this token.
# - Trusted publishing. When the secret is not visible to the job,
#   `rust-lang/crates-io-auth-action` exchanges the job's GitHub OIDC token for
#   a crates.io token that expires after 30 minutes and is revoked at the end
#   of the job.
#
# docs/krabka-sspi-release.md gives the procedure.
#
# A rerun is safe. The plan job asks crates.io whether the version exists and
# skips the upload if it does.

on:
  push:
    tags: ["krabka-sspi-v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Package and verify krabka-sspi, but upload nothing
        type: boolean
        default: true

permissions: {}

concurrency:
  group: publish-krabka-sspi-${{ github.ref }}
  cancel-in-progress: false

env:
  CRATE: krabka-sspi
  TAG_PREFIX: krabka-sspi-v
  # crates.io refuses an API request without a User-Agent that names the caller.
  USER_AGENT: krabka-sspi-publish (https://github.com/krabka-io/sspi-rs)

jobs:
  # Checks that the ref is releasable, asks crates.io whether the version is
  # already there, and packages and verifies the crate with `cargo publish
  # --dry-run`. It holds no credential.
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.mode.outputs.publish }}
      pending: ${{ steps.pending.outputs.pending }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: decide whether this run uploads
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "${EVENT}" = push ] || [ "${DRY_RUN}" = false ]; then
            if [ "${GITHUB_REF_TYPE}" != tag ] || [[ "${GITHUB_REF_NAME}" != "${TAG_PREFIX}"* ]]; then
              echo "A publish runs from a ${TAG_PREFIX}* tag. ${GITHUB_REF} is not one; start a dry run instead." >&2
              exit 1
            fi
            echo publish=true >>"${GITHUB_OUTPUT}"
          else
            echo publish=false >>"${GITHUB_OUTPUT}"
          fi

      - name: read the manifest version
        id: version
        run: |
          cargo metadata --no-deps --format-version 1 --locked >"${RUNNER_TEMP}/metadata.json"
          version="$(jq -r --arg c "${CRATE}" '.packages[] | select(.name == $c) | .version' "${RUNNER_TEMP}/metadata.json")"
          if [ -z "${version}" ]; then
            echo "The workspace has no ${CRATE} package." >&2
            exit 1
          fi
          others="$(jq -r --arg c "${CRATE}" '.packages[] | select(.name != $c and .publish != []) | .name' "${RUNNER_TEMP}/metadata.json")"
          if [ -n "${others}" ]; then
            echo "Only ${CRATE} may be publishable, but these crates are too (set publish = false):" >&2
            echo "${others}" >&2
            exit 1
          fi
          echo "${CRATE} ${version}"
          echo "version=${version}" >>"${GITHUB_OUTPUT}"

      - name: the manifest version names the tag
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          expected="${GITHUB_REF_NAME#"${TAG_PREFIX}"}"
          if [ "${VERSION}" != "${expected}" ]; then
            echo "${GITHUB_REF_NAME} names version ${expected}, but ${CRATE} is ${VERSION} in Cargo.toml." >&2
            exit 1
          fi

      - name: is the version on crates.io
        id: pending
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          status="$(curl -sS -o /dev/null -w '%{http_code}' -A "${USER_AGENT}" \
            "https://crates.io/api/v1/crates/${CRATE}/${VERSION}")"
          case "${status}" in
            200) echo "${CRATE} ${VERSION} is on crates.io; skipping"; echo pending=false >>"${GITHUB_OUTPUT}" ;;
            404) echo "${CRATE} ${VERSION} is pending"; echo pending=true >>"${GITHUB_OUTPUT}" ;;
            *) echo "crates.io answered ${status} for ${CRATE} ${VERSION}" >&2; exit 1 ;;
          esac

      # Packages the crate and builds it from the packaged sources against
      # dependencies from crates.io.
      - name: package and verify
        if: steps.pending.outputs.pending == 'true'
        run: cargo publish --dry-run --locked -p "${CRATE}"

  publish:
    name: publish
    needs: plan
    if: needs.plan.outputs.publish == 'true' && needs.plan.outputs.pending == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Restricted to `krabka-sspi-v*` tags, so only a release tag reaches the
    # credential. crates.io's trusted-publisher entry for krabka-sspi, if one
    # is configured, names this environment.
    environment: crates-io
    permissions:
      contents: read
      # The OIDC token that crates-io-auth-action exchanges for a crates.io
      # token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: choose the credential
        id: credential
        env:
          HAS_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
        run: |
          if [ "${HAS_TOKEN}" = true ]; then
            echo 'CARGO_REGISTRY_TOKEN is visible: publishing with the krabka-io organization token.'
            echo mode=token >>"${GITHUB_OUTPUT}"
          else
            echo 'CARGO_REGISTRY_TOKEN is not visible: publishing through trusted publishing.'
            echo mode=oidc >>"${GITHUB_OUTPUT}"
          fi

      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        if: steps.credential.outputs.mode == 'oidc'
        id: auth

      # The plan job already verified the package, so this run does not build
      # it again; that keeps the upload inside the 30-minute life of a
      # trusted-publishing token.
      - name: publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked --no-verify -p "${CRATE}"
